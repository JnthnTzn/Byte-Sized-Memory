<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byte-Sized Memory</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Font & Font Awesome Icons for Tech Terms/Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>
<body>

  <header class="game-header">
    <h1>&lt;Byte-Sized Memory /&gt;</h1>
    <p class="subtitle">Match tech cards to test your memory!</p>
  </header>

  <!-- Main Game Container -->
  <main class="game-container">
    <div class="memory-grid" id="memoryGrid">
      <!-- JavaScript will dynamically inject cards here -->
    </div>
  </main>

  <!-- Win Modal Overlay -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-content">
      <h2>🎉 Mission Accomplished!</h2>
      <p>You successfully matched all 8 tech pairs!</p>
      <button id="restartBtn" class="btn-primary">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
